<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>からだログ 表示・初回設定テスト</title><style>body{margin:16px;background:#e8eeea;color:#18312d;font:14px system-ui}header{margin:0 0 12px}button{padding:8px;margin-right:8px}iframe{display:block;border:1px solid #aaa;background:white;width:390px;height:844px}p{margin:8px 0}</style><header><strong>からだログ：スマホ幅での検証</strong><p>検証用の記録だけをメモリに保存します。通常アプリの記録は読み書きしません。</p><button id="narrow">360px</button><button id="normal">390px</button><button id="wide">430px</button><button id="restart">アプリを再読込</button><span id="size">390px</span></header><iframe id="app" title="スマホ表示の検証"></iframe><script>
const records=new Map();window.testStorage={getItem:key=>records.get(String(key))??null,setItem:(key,value)=>records.set(String(key),String(value)),removeItem:key=>records.delete(String(key)),clear:()=>records.clear()};
const frame=document.getElementById('app');
async function boot(){const response=await fetch('./index.html');if(!response.ok)throw new Error('公開ページの取得失敗');const html=await response.text();const setup='<base href="'+location.href.replace(/[^/]*$/,'')+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';frame.srcdoc=html.replace('<head>','<head>'+setup);}
for(const [id,width]of [['narrow',360],['normal',390],['wide',430]])document.getElementById(id).onclick=()=>{frame.style.width=width+'px';document.getElementById('size').textContent=width+'px';};document.getElementById('restart').onclick=boot;boot();
</script></html>
